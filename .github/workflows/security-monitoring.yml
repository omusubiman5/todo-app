name: 🛡️ Security Monitoring

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 毎日午前2時にセキュリティチェック実行
    - cron: '0 2 * * *'

jobs:
  security-audit:
    name: 🔍 Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🛡️ Run security lint check
      run: npm run security-check:critical
      continue-on-error: true

    - name: 🔍 NPM Security Audit
      run: npm run security-audit
      continue-on-error: true

    - name: 📊 Type Check
      run: npm run type-check
      continue-on-error: true

  dependency-security:
    name: 🔗 Dependency Security
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📚 Install dependencies
      run: npm ci

    - name: 🔍 Security vulnerability scan
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'security-scan-results.sarif'
      continue-on-error: true

  code-security:
    name: 🔒 Code Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: javascript, typescript

    - name: 🏗️ Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: 🔍 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  security-report:
    name: 📊 Security Report
    runs-on: ubuntu-latest
    needs: [security-audit, dependency-security, code-security]
    if: always()

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📊 Generate Security Report
      run: |
        echo "# 🛡️ Security Monitoring Report" > security-report.md
        echo "Date: $(date)" >> security-report.md
        echo "" >> security-report.md
        echo "## 📋 Summary" >> security-report.md
        echo "- Security Audit: ${{ needs.security-audit.result }}" >> security-report.md
        echo "- Dependency Security: ${{ needs.dependency-security.result }}" >> security-report.md
        echo "- Code Security: ${{ needs.code-security.result }}" >> security-report.md

    - name: 📎 Upload Security Report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md